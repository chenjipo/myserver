<{include file="../public/head.html"}>
<style>
    .layui-form-label{
        width:200px;
    }
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body my-card">
            <form class="layui-form my-layui-form layui-card-body" lay-filter="filter-form">
                <input type="hidden" value="" name="admin_id">
                <div class="layui-form-item">
                    <label class="layui-form-label">* 帐号：</label>
                    <div class="layui-input-inline">
                        <input type="text" name="user" placeholder="不多于8个字符" value="" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">* 中文名称：</label>
                    <div class="layui-input-inline">
                        <input type="text" name="nick" placeholder="不多于8个字符" value="" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">* 密码：</label>
                    <div class="layui-input-inline">
                        <input type="password" name="pwd" placeholder="非特殊字符,包含字母数字" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">* 确认密码：</label>
                    <div class="layui-input-inline">
                        <input type="password" name="pwd2" placeholder="非特殊字符,包含字母数字" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"> 手机号：</label>
                    <div class="layui-input-inline">
                        <input type="text" name="phone" placeholder="" value="" autocomplete="off" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"> 需要登陆验证：</label>
                    <div class="layui-input-inline">
                        <input type="checkbox" name="phone_login" value="1" lay-skin="switch" lay-text="是|否">
                    </div>
                </div>
    
                <div class="layui-form-item">
                    <label class="layui-form-label" >角色：</label>
                    <div class="layui-input-inline">
                        <select name="role_id" lay-search="">
                            <option value="">选择角色</option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label" >投放权限组：</label>
                    <div class="layui-input-inline">
                        <select name="mk_id" lay-search="">
                            <option value="">请选择(不选代表拥有所有权限)</option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label" >数据权限组：</label>
                    <div class="layui-input-inline">
                        <select name="data_id" lay-search="">
                            <option value="">请选择(不选代表拥有所有权限)</option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label" ></label>
                    <div class="layui-input-inline">
                        <button type="button" class="layui-btn layui-btn-sm" lay-submit lay-filter="commit"> 保 存 </button>
                        <button type="button" id="closeBtn" class="layui-btn layui-btn-normal layui-btn-sm"> 取 消 </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
layui.use(['tool','form'], function(){
    //监听提交
    var form = layui.form,
        tool = layui.tool,
        $ = layui.$,
        id = tool.getQueryString('id')
    //监听提交
    form.on('submit(commit)', function(data){
        tool.ajaxPost('/admin/addAdminAction/',data.field,function(re){
            // console.log(re);
            layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                shadeClose: true,
                content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                time: 2000,
                end:function(){
                    if(re.state == true){
                        closeLayer()
                        parent.window.location.reload();
                    }
                }
            });
        });
        return false;
    });

    tool.ajaxGetSync('/admin/getRoleList/',function(result){
        if(result.state){
            var select = $('select[name=role_id]');
            result.data.list.forEach(element => {
                select.append('<option value="'+element['id']+'"> '+element['id']+'-'+element['display_name']+'</option>');
            });
            form.render('select');
        }
    })

    tool.ajaxGetSync('/admin/getMkAuthorityList/',function(result){
        if(result.state){
            var select = $('select[name=mk_id]');
            result.data.list.forEach(element => {
                select.append('<option value="'+element['id']+'"> '+element['id']+'-'+element['name']+'</option>');
            });
            form.render('select');
        }
    })

    tool.ajaxGetSync('/admin/getDataAuthorityList/',function(result){
        if(result.state){
            var select = $('select[name=data_id]');
            result.data.list.forEach(element => {
                select.append('<option value="'+element['id']+'"> '+element['id']+'-'+element['name']+'</option>');
            });
            form.render('select');
        }
    })

    if(Number(id)>0){
        tool.ajaxGet('/admin/getAdminInfo/?id='+id, function(result){
            if(result.state){
                form.val('filter-form',result.data);
                $('input[name=pwd]').val('');
                $('input[name=pwd2]').val('');
                form.render()
            }
        })
    }

    $('#closeBtn').on('click',function(){
        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
        parent.layer.close(index); //再执行关闭
    });

    function closeLayer(){
        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
        parent.layer.close(index); //再执行关闭
    }
});
</script>
<{include file="../public/foot.html"}>
