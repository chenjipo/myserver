<{include file="../public/head.html"}>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body my-card">
            <form class="layui-form my-layui-form layui-card-body" lay-filter="filter-form">
                <div class="layui-form-item">
                    <label for="" class="layui-form-label">授权游戏</label>
                    <div class="layui-input-block">
                        <div id="mgids-transfer"></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label for="" class="layui-form-label">授权联运商</label>
                    <div class="layui-input-block">
                        <div id="pids-transfer"></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label for="" class="layui-form-label">授权投放渠道</label>
                    <div class="layui-input-block">
                        <div id="cids-transfer"></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn layui-btn-sm" lay-submit lay-filter="commit"> 保 存 </button>
                        <button type="button" id="closeBtn" class="layui-btn layui-btn-normal layui-btn-sm"> 取 消 </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
    <script type="text/javascript">
        layui.use(['transfer','util','layer','tool','form','tree'],function () {
            var $ = layui.jquery;
            var layer = layui.layer;
            var transfer = layui.transfer;
            var form = layui.form;
            var tree = layui.tree;
            var tool = layui.tool;
            var id = tool.getQueryString('id');
            //渲染

            tool.ajaxGet('/admin/getDataAuthorityTree/?id='+id,function(result){
                if(result.state){
                    renderMgidsTransfer(result.data.mgids)
                    renderPidsTransfer(result.data.pids)
                    renderCidsTransfer(result.data.cids)
                }
            });

            function renderMgidsTransfer(data){
                var list = data && data.list || []
                var value = data && data.value || []
                transfer.render({
                    elem: '#mgids-transfer'
                    ,id:'mgids'
                    ,title: ['可授权主游戏', '已授权主游戏']  //自定义标题
                    ,data: list
                    //,width: 150 //定义宽度
                    ,height: 210 //定义高度
                    ,value: value
                    ,showSearch: true
                })
            }
            function renderPidsTransfer(data){
                var list = data && data.list || []
                var value = data && data.value || []
                transfer.render({
                    elem: '#pids-transfer'
                    ,id:'pids'
                    ,title: ['可授权联运商', '已授权联运商']  //自定义标题
                    ,data: list
                    //,width: 150 //定义宽度
                    ,height: 310 //定义高度
                    ,value: value
                    ,showSearch: true
                })
            }
            function renderCidsTransfer(data){
                var list = data && data.list || []
                var value = data && data.value || []
                transfer.render({
                    elem: '#cids-transfer'
                    ,id:'cids'
                    ,title: ['可授权投放渠道', '已授权投放渠道']  //自定义标题
                    ,data: list
                    //,width: 150 //定义宽度
                    ,height: 310 //定义高度
                    ,value: value
                    ,showSearch: true
                })
            }

            //监听提交
            form.on('submit(commit)', function(data){
                var mgids = transfer.getData('mgids'); //获取右侧数据
                var pids = transfer.getData('pids'); //获取右侧数据
                var cids = transfer.getData('cids'); //获取右侧数据
                // layer.alert(JSON.stringify(getData))
                tool.ajaxPost('/admin/dataAuthorityEmpowerAction',{id:id,mgids:mgids,pids:pids,cids:cids},function(re){
                    // console.log(re);
                    layer.open({
                        type: 1,
                        title: false,
                        closeBtn: 0,
                        shadeClose: true,
                        content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                        time: 2000,
                        end:function(){
                            if(re.state == true){
                                closeLayer()
                                parent.window.location.reload();
                            }
                        }
                    });
                });
                return false;
            });

            $('#closeBtn').on('click',function(){
                var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                parent.layer.close(index); //再执行关闭
            });

            function closeLayer(){
                var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                parent.layer.close(index); //再执行关闭
            }
            
        })
    </script>
