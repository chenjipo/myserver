<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>管理后台</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/static/layui_2.6.8/css/layui.css?v=<{$smarty.const.VERSION}>" media="all">
    <link rel="stylesheet" href="/static/style/admin.css?v=<{$smarty.const.VERSION}>" media="all">
</head>
<body class="layui-layout-body">
<div id="LAY_app">
    <div class="layui-layout layui-layout-admin">
        <div class="layui-header">
            <!-- 头部区域 -->
            <ul class="layui-nav layui-layout-left" id="nav-top">
                <li class="layui-nav-item layadmin-flexible" lay-unselect>
                    <a href="javascript:;" layadmin-event="flexible" title="侧边伸缩">
                        <i class="layui-icon layui-icon-shrink-right" id="LAY_app_flexible"></i>
                    </a>
                </li>
                <!--
                <{foreach $__menu_top__ as $k=>$m}>
                <li class="layui-nav-item pcTopMenu <{if $k==$__menu_top_this__}>layui-this<{/if}>" data-menu="<{$k}>" >
                    <a href="javascript:;"><i class="fa fa-<{$m['icon'] nofilter}>"></i>&nbsp;<cite><{$m['title']}></cite></a>
                </li>
                <{/foreach}>
                <li class="layui-nav-item mobileTopMenu" lay-unselect>
                    <a href="javascript:;" lay-tips="菜单">
                        <cite>菜单选择</cite>
                    </a>
                    <dl class="layui-nav-child">
                        <{foreach $__menu_top__ as $k=>$m}>
                        <dd data-menu="<{$k}>">
                            <a href="javascript:;"><i class="fa fa-<{$m['icon'] nofilter}>"></i>&nbsp;<cite><{$m['title']}></cite></a>
                        </dd>
                        <{/foreach}>
                    </dl>
                </li>
                -->
            </ul>
            <ul class="layui-nav layui-layout-right" lay-filter="layadmin-layout-right">
                <li class="layui-nav-item" lay-unselect>
                    <a href="javascript:;" layadmin-event="refresh" title="刷新">
                        <i class="layui-icon layui-icon-refresh-3"></i>
                    </a>
                </li>
                <li class="layui-nav-item" lay-unselect>
                    <a href="javascript:;">
                        <cite id="admin_user"></cite>
                    </a>
                    <dl class="layui-nav-child">
                        <!--
                        <dd><a lay-href="set/user/info.html">基本资料</a></dd> -->
                        <dd><a id="changePw" lay-href="">修改密码</a></dd>
                        <hr>

                        <dd style="text-align: center;"><a href="/login/logoutAction">退出</a></dd>
                    </dl>
                </li>
            </ul>
        </div>

        <!-- 侧边菜单 -->
        <div class="layui-side layui-side-menu">
            <div class="layui-side-scroll">
                <div class="layui-logo">
                    <span>管理后台系统</span>
                </div>
                <ul class="layui-nav layui-nav-tree" lay-shrink="all" id="LAY-system-side-menu" lay-filter="layadmin-system-side-menu">
                </ul>
            </div>
        </div>

        <!-- 页面标签 -->
        <div class="layadmin-pagetabs" id="LAY_app_tabs">
            <div class="layui-icon layadmin-tabs-control layui-icon-prev" layadmin-event="leftPage"></div>
            <div class="layui-icon layadmin-tabs-control layui-icon-next" layadmin-event="rightPage"></div>
            <div class="layui-icon layadmin-tabs-control layui-icon-down">
                <ul class="layui-nav layadmin-tabs-select" lay-filter="layadmin-pagetabs-nav">
                    <li class="layui-nav-item" lay-unselect>
                        <a href="javascript:;"></a>
                        <dl class="layui-nav-child layui-anim-fadein">
                            <dd layadmin-event="closeThisTabs"><a href="javascript:;">关闭当前标签页</a></dd>
                            <dd layadmin-event="closeOtherTabs"><a href="javascript:;">关闭其它标签页</a></dd>
                            <dd layadmin-event="closeAllTabs"><a href="javascript:;">关闭全部标签页</a></dd>
                        </dl>
                    </li>
                </ul>
            </div>
            <div class="layui-tab" lay-unauto lay-allowClose="true" lay-filter="layadmin-layout-tabs">
                <ul class="layui-tab-title" id="LAY_app_tabsheader">
                    <li lay-id="home/console.html" lay-attr="home/console.html" class="layui-this"><i class="layui-icon layui-icon-home"></i></li>
                </ul>
            </div>
        </div>


        <!-- 主体内容 -->
        <div class="layui-body" id="LAY_app_body">
            <div class="layadmin-tabsbody-item layui-show">
                <iframe src="/index/console" frameborder="0" class="layadmin-iframe"></iframe>
            </div>
        </div>

        <!-- 辅助元素，一般用于移动设备下遮罩 -->
        <div class="layadmin-body-shade" layadmin-event="shade"></div>
    </div>
</div>

<script src="/static/layui_2.6.8/layui.js?v=<{$smarty.const.VERSION}>"></script>
<script>
    layui.config({
        version: '<{$smarty.const.VERSION}>',
        base: '/static/' //静态资源所在路径
    }).extend({
        navs: 'modules/navs',
        index: 'modules/index', //主入口模块
        tool: 'modules/tool',
        xmSelect: 'modules/xmSelect'
    }).use(['tool','jquery','navs','index'],function(){
        var navs = layui.navs;
        var $ = layui.$;
        var tool = layui.tool;

        tool.ajaxGet('/admin/getAdminNav/',function(result){
            if(result.state){
                var nick = result.data.user.nick
                $('#admin_user').html(nick)
                var changePwUrl = '/admin/changePwPage/?id='+result.data.user.admin_id
                $('#changePw').attr('lay-href',changePwUrl)

                layui.menuData = result.data.list
                var data = result.data.list || []
                var topHtml = '<li class="layui-nav-item layadmin-flexible" lay-unselect><a href="javascript:;" layadmin-event="flexible" title="侧边伸缩"><i class="layui-icon layui-icon-shrink-right" id="LAY_app_flexible"></i></a></li>'
                if(data.length>0){
                    data.forEach(e => {
                        topHtml += '<li class="layui-nav-item pcTopMenu layui-this" data-menu="'+e.id+'" ><a href="javascript:;"><i class="layui-icon '+e.icon+'"></i>&nbsp;<cite>'+e.display_name+'</cite></a></li>'
                    });
                }
                $('#nav-top').html(topHtml)
                navs.render(data[0].id);
            }
        })
        
        $('body').on('click',".pcTopMenu,.mobileTopMenu dd",function(){
            $(this).addClass("layui-this").siblings().removeClass("layui-this");
            navs.render($(this).data('menu'));
        })
        
        $('body').on('click',".mobileTopMenu dd",function(){
            if($('#LAY_app_flexible').hasClass('layui-icon-shrink-right')){
            }else{
                $('#LAY_app_flexible').click();
            }
        })
    });
</script>
</body>
</html>
