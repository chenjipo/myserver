<{include file="../public/head.html"}>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-form layui-card-header layuiadmin-card-header-auto my-layui-form">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="accid" value="" placeholder="输入账户ID">
                    </div>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="accname" value="" placeholder="输入账户名称">
                    </div>

                    <div class="layui-input-inline">
                        <select name="cid" lay-search="" lay-filter="cid">
                            <option value="">选择渠道</option>
                        </select>
                    </div>
                    <div class="layui-input-inline">
                        <select name="agtid" lay-search="" lay-filter="agtid">
                            <option value="">选择代理</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline">
                    <div class="layui-input-inline">
                        <select name="cpnid" lay-search="" lay-filter="cpnid">
                            <option value="">选择主体</option>
                        </select>
                    </div>
                    <div class="layui-input-inline">
                        <select name="pitid" lay-search="" lay-filter="pitid">
                            <option value="">选择投放人员</option>
                        </select>
                    </div>
                    <div class="layui-input-inline">
                        <select name="status" lay-search="" lay-filter="status">
                            <option value="">选择状态</option>
                            <option value="1" selected>启用中</option>
                            <option value="2">停用</option>
                        </select>
                    </div>
                    <div class="layui-input-inline layui-btn-group">
                        <button type="submit" class="layui-btn layui-btn-sm" lay-submit lay-filter="filter-search"> 筛 选 </button>
                        <button type="submit" class="layui-btn layui-btn-sm layui-btn-normal js-add"> 添 加 </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-card-body my-card">
            <table class="layui-table" id="my-table" lay-filter="filter-table"></table>
            <script type="text/html" id="my-operate">
                <div class="layui-btn-group">
                    {{# if(d.auth_time == 0){ }}
                    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="auth">授权</a>
                    {{# }else{ }}
                    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="auth">重新授权</a>
                    {{# } }}
                    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a>
                    {{# if(d.status == 0){ }}
                    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="stop"><i class="layui-icon layui-icon-close"></i>停用</a>
                    {{# }else{ }}
                    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="start"><i class="layui-icon layui-icon-light"></i>启用</a>
                    {{# } }}
                    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
                </div>
            </script>
        </div>
    </div>
</div>
<script>
layui.use(['tool','table'], function(){
    var $ = layui.$;
    var form = layui.form;
    var table = layui.table;
    var tool = layui.tool;

    var cids;
    tool.ajaxGetSync('/platform/getChannelOption',function(result){
        cids = {}
        if(result.state){
            var list = result.data
            var select = $('select[name=cid]');
            for(var i in list){
                cids[list[i]['cid']] = list[i]['cname'];
                select.append('<option value="'+list[i]['cid']+'"> ['+list[i]['cid']+ ']-'+list[i]['cname']+'</option>');
            }
            form.render('select');
        }
    })
    
    var agtids;
    tool.ajaxGetSync('/mk/getAgentOption',function(result){
        agtids = {}
        if(result.state){
            var list = result.data
            var select = $('select[name=agtid]');
            for(var i in list){
                agtids[list[i]['agtid']] = list[i]['agtname'];
                select.append('<option value="'+list[i]['agtid']+'"> ['+list[i]['agtid']+ ']-'+list[i]['agtname']+'</option>');
            }
            form.render('select');
        }
    })

    var cpnids;
    tool.ajaxGetSync('/mk/getCompanyOption',function(result){
        cpnids = {}
        if(result.state){
            var list = result.data
            var select = $('select[name=cpnid]');
            for(var i in list){
                cpnids[list[i]['cpnid']] = list[i]['cpnname'];
                select.append('<option value="'+list[i]['cpnid']+'"> ['+list[i]['cpnid']+ ']-'+list[i]['cpnname']+'</option>');
            }
            form.render('select');
        }
    })

    var pitids;
    tool.ajaxGetSync('/mk/getPitcherOption',function(result){
        pitids = {}
        if(result.state){
            var list = result.data
            var select = $('select[name=pitid]');
            for(var i in list){
                pitids[list[i]['pitid']] = list[i]['pitname'];
                select.append('<option value="'+list[i]['pitid']+'"> ['+list[i]['pitid']+ ']-'+list[i]['pitname']+'</option>');
            }
            form.render('select');
        }
    })

    table.render({
        elem: '#my-table'
        ,size: 'sm'
        ,url:'/mk/getAdAccountList?status='+$('select[name=status]').val()
        ,cols: [[
            {field:'accid', title: '账户ID',width:80}
            ,{field:'accname', title: '账户名称',width:200}
            ,{field:'cid_txt', title: '渠道',width:100}
            ,{field:'agtid_txt', title: '代理',width:100}
            ,{field:'pitid_txt', title: '投放人员',width:100}
            ,{field:'cpnid_txt', title: '主体',width:180}
            ,{field:'status_name', title: '状态',width: 80}
            ,{field:'atime',  title: '创建时间',width:150}
            ,{field:'mtime', title: '修改时间',width:150}
            ,{title:'操作', fixed: 'right',align:'center', width:300, toolbar: '#my-operate'}
        ]]
        ,page: {
            layout: ['prev', 'page', 'next', 'skip' ,'count']
            ,limit:20
        }
        ,parseData: function(res){
            var list = res.data.list;
            if(list != undefined && list.length>0){
                for(var i=0;i<list.length;i++){
                    list[i].atime =  tool.toDateString(list[i].atime);
                    list[i].cid_txt = cids[list[i].cid]
                    list[i].agtid_txt = agtids[list[i].agtid]
                    list[i].pitid_txt = pitids[list[i].pitid]
                    list[i].cpnid_txt = cpnids[list[i].cpnid]
                    list[i].status_name = Number(list[i].status) == 1 ?'已停用':'<span style="color:green;">启用中</span>'
                }
            }
            return {
                "code": 0,
                'msg': "获取数据成功！",
                "count": res.data.total,
                "data": res.data.list
            }
        }
        ,done: function(res, curr, count){

        }
    });

    //监听搜索
    form.on('submit(filter-search)', function(data){
        var field = data.field;
        //执行重载
        table.reload('my-table', {
            where: field
        });
    });

    //监听工具条
    table.on('tool(filter-table)', function(obj){
        var data = obj.data;
        if(obj.event === 'del'){
            // return layer.msg('暂不支持删除！')
            layer.confirm('真的删除么', function(index){
                del(data);
                obj.del();
                layer.close(index);
            });
        } 
        else if(obj.event === 'stop'){
            layer.confirm('确认停用吗！', function(index){
                changeStatus(data,obj);
                layer.close(index);
            });
        } else if(obj.event === 'start'){
            layer.confirm('确认启用吗！', function(index){
                changeStatus(data,obj);
                layer.close(index);
            });
        }
        else if(obj.event === 'edit'){
            add(data);
        } else if(obj.event === 'auth'){
            auth(data);
        } 
    });

    // 添加APP按钮
    $(".js-add").click(function(){
        add();
    })

    function changeStatus(data,obj){
        // layer.msg('暂时未开放')
        var status = data.status == 0 ? 1 : 0;
        var post = {status:status,id:data.accid}
        tool.ajaxPost('/mk/changeAdAccountStatus',post,function(re){
            layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                shadeClose: true,
                content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                time: 2000,
                end:function(){
                    table.reload('my-table', {
                    });
                }
            });
        });
    }

    function add(edit){
        var api = "/mk/addAdAccountPage";
        var txt = "添加";
        if(edit){
            api += "?id="+edit.accid;
            txt = "编辑"
        }
        var index = layui.layer.open({
            title: txt,
            type: 2,
            area: ["1px", "1px"],
            content: api
        })
        layui.layer.full(index);
        $(window).on("resize",function(){
            layui.layer.full(index);
        })
    }

    function del(data){
        // console.log(data);
        var id = data.accid;
        tool.ajaxPost('/mk/deleteAdAccountAction',{'id':id},function(re){
            // console.log(re)
            layer.open({
                type: 1,
                title:false,
                closeBtn: 0,
                shadeClose: true,
                content:'<p style="margin:15px 30px;">'+re.msg+'</p>',
                time:1000,
            });
        },'json');
    }

    function auth(data){
        window.open(data.auth_url)
    }
});
</script>
<{include file="../public/foot.html"}>
