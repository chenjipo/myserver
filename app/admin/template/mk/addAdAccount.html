<{include file="../public/head.html"}>
<style>
.layui-form-label{width:200px;}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body my-card">
            <form class="layui-form my-layui-form layui-card-body" lay-filter="filter-form">
                <input type="hidden" name="accid" value="" />
                <div class="layui-card">
                    <div class="layui-card-header"><b>基础信息</b></div>
                    <div class="layui-card-body">
                        <div class="layui-form-item">
                            <label class="layui-form-label">选择渠道</label>
                            <div class="layui-input-inline">
                                <select name="cid" lay-search="" lay-filter="cid">
                                    <option value="">选择渠道</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">选择代理</label>
                            <div class="layui-input-inline">
                                <select name="agtid" lay-search="" lay-filter="agtid">
                                    <option value="">选择代理</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">选择主体</label>
                            <div class="layui-input-inline">
                                <select name="cpnid" lay-search="" lay-filter="cpnid">
                                    <option value="">选择主体</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">选择投放人员</label>
                            <div class="layui-input-inline">
                                <select name="pitid" lay-search="" lay-filter="pitid">
                                    <option value="">选择投放人员</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">账户名称</label>
                            <div class="layui-input-inline">
                                <input type="text" class="layui-input" name="accname" value="">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">账户别名</label>
                            <div class="layui-input-inline">
                                <input type="text" class="layui-input" name="alias" value="">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">账户停用</label>
                            <div class="layui-input-inline">
                                <input type="radio" name="status" value="0" title="可用" checked>
                                <input type="radio" name="status" value="1" title="停用" >
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-card">
                    <div class="layui-card-header"><b>参数配置</b></div>
                    <div class="layui-card-body">
                        <div id="config_tpl">
                        </div>
                    </div>
                </div>
                

                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn layui-btn-sm"  lay-submit lay-filter="commit"> 保 存 </button>
                        <button type="button" id="closeBtn" class="layui-btn layui-btn-normal layui-btn-sm"> 取 消 </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
layui.use(['tool','form'], function(){
    var $ = layui.$;
    var form = layui.form;
    var tool = layui.tool;
    var id = tool.getQueryString('id') || '';

    tool.ajaxGetSync('/platform/getChannelOption',function(result){
        if(result.state){
            var list = result.data
            var select = $('select[name=cid]');
            for(var i in list){
                select.append('<option value="'+list[i]['cid']+'"> ['+list[i]['cid']+ ']-'+list[i]['cname']+'</option>');
            }
            form.render('select');
        }
    })
    
    tool.ajaxGetSync('/mk/getAgentOption',function(result){
        if(result.state){
            var list = result.data
            var select = $('select[name=agtid]');
            for(var i in list){
                select.append('<option value="'+list[i]['agtid']+'"> ['+list[i]['agtid']+ ']-'+list[i]['agtname']+'</option>');
            }
            form.render('select');
        }
    })

    tool.ajaxGetSync('/mk/getCompanyOption',function(result){
        if(result.state){
            var list = result.data
            var select = $('select[name=cpnid]');
            for(var i in list){
                select.append('<option value="'+list[i]['cpnid']+'"> ['+list[i]['cpnid']+ ']-'+list[i]['cpnname']+'</option>');
            }
            form.render('select');
        }
    })

    tool.ajaxGetSync('/mk/getPitcherOption',function(result){
        if(result.state){
            var list = result.data
            var select = $('select[name=pitid]');
            for(var i in list){
                select.append('<option value="'+list[i]['pitid']+'"> ['+list[i]['pitid']+ ']-'+list[i]['pitname']+'</option>');
            }
            form.render('select');
        }
    })

    form.on('select(cid)',function(data){
        getTpl(data.value)
    })

    function getTpl(cid){
        tool.ajaxGetSync('/mk/getChannelConfigTplInfo?cid='+cid,function(result){
            if(result.state && result.data){
                var html = '';
                result.data.forEach(ele => {
                    html += '<div class="layui-form-item">'
                    html += '     <label class="layui-form-label">'+ele.value+'</label>'
                    html += '     <div class="layui-input-inline">'
                    html += '         <div class="layui-input-inline">'
                    html += '             <input type="text" class="layui-input" name="'+ele.key+'" value="">'
                    html += '         </div>'
                    html += '     </div>'
                    html += ' </div>'
                });
                $('#config_tpl').html(html)
            }
        })
    }
   

    if(Number(id)>0){
        tool.ajaxGet('/mk/getAdAccountInfo?id='+id, function(result){
            if(result.state){
                getTpl(result.data.cid)
                form.val('filter-form',result.data);
            }else{
                layer.msg(re.msg);
            }
        });
        form.render();
    }

    //监听提交
    form.on('submit(commit)', function(data){
        tool.ajaxPost('/mk/addAdAccountAction',form.val('filter-form'),function(re){
            // console.log(re);
            layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                shadeClose: true,
                content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                time: 2000,
                end:function(){
                    if(re.state == true){
                        closeLayer()
                        parent.window.location.reload();
                    }
                }
            });
        },'json');
        return false;
    });

    $('#closeBtn').on('click',function(){
        closeLayer()
    });

    function closeLayer(){
        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
        parent.layer.close(index); //再执行关闭
    }
});
</script>
<{include file="../public/foot.html"}>
