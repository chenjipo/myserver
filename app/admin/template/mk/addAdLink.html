<{include file="../public/head.html"}>
<style>
.layui-form-label{width:200px;}
.layui-input-inline{width:500px!important;}
.js-lname-tips{
    font-size: 12px;
    line-height: 17px;
    height: 30px;
    display: block;
    color: #CCCCCC;
    font-weight: normal;
}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body my-card">
            <form class="layui-form my-layui-form layui-card-body" lay-filter="filter-form">
                <input type="hidden" name="linkid" value="" />
                <div class="layui-form-item js-linkid" style="display: none;">
                    <label class="layui-form-label">推广链ID</label>
                    <div class="layui-input-inline" style="font-size: 30px;line-height: 34px;margin-left: 3px;">
                        <span class="js-linkid-txt" style="color:#262626"></span> 
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">推广链名称</label>
                    <div class="layui-input-inline" style="height:45px;">
                        <input type="text" class="layui-input" name="lname" value="" placeholder="用占位符{初始数字}，如jdxmj-KA50-{1}，将创建jdxmj-KA50-0001，jdxmj-KA50-0002...等">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">选择推广渠道</label>
                    <div class="layui-input-inline">
                        <select name="cid" lay-search="" lay-filter="cid">
                            <option value="">选择渠道</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">选择投放账户</label>
                    <div class="layui-input-inline">
                        <select name="accid" lay-search="" lay-filter="accid">
                            <option value="">选择投放账户</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">应用类型</label>
                    <div class="layui-input-inline">
                        <input type="radio" name="apptype" lay-filter="apptype" value="1" title="Android">
                        <input type="radio" name="apptype" lay-filter="apptype" value="2" title="iOS" >
                        <input type="radio" name="apptype" lay-filter="apptype" value="3" title="小游戏" >
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">选择游戏</label>
                    <div class="layui-input-inline">
                        <select name="gid" lay-search="" lay-filter="gid">
                            <option value="">选择游戏</option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item js-pkg-tips js-1" style="display: none;">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-inline" style="color: #707070;font-size: 12px;">
                        温馨提示：可批量创建一次最多5条，渠道包数量 <span class="js-pkg-number" style="color: red">0</span> 个
                    </div>
                </div>

                <div class="layui-form-item js-apple-tips js-2" style="display: none;">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-inline" style="color: #707070;font-size: 12px;">
                        苹果商店应用链接：<span id="js-apple-url"></span>
                    </div>
                </div>

                <div class="layui-form-item js-mini-tips js-3" style="display: none;">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-inline" style="color: #707070;font-size: 12px;">
                        小游戏APPID：<span id="js-mini-appid"></span>
                    </div>
                </div>

                <div class="layui-form-item js-pkg-select js-1" style="display: none;">
                    <label class="layui-form-label">选择渠道包</label>
                    <div class="layui-input-inline">
                        <div id="pkg" class="layui-input"></div>
                    </div>
                </div>
                <div class="layui-form-item js-number js-2 js-3" style="display: none;">
                    <label class="layui-form-label">批量创建数量</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="number" value="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn layui-btn-sm"  lay-submit lay-filter="commit"> 保 存 </button>
                        <button type="button" id="closeBtn" class="layui-btn layui-btn-normal layui-btn-sm"> 取 消 </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
layui.use(['form','tool','xmSelect'], function(){
    var $ = layui.$;
    var form = layui.form;
    var tool = layui.tool;
    var xmSelect = layui.xmSelect;
    var id = tool.getQueryString('id') || '';


    tool.getChannelOption({pid:1})
    form.on('select(cid)', function (data) {
        var cid = data.value
        if(cid>0){
            tool.getAdAccountOption({cid:cid})
        }
    })

    var gameMap;
    form.on('radio(apptype)', function (data) {
        $('.js-1').hide()
        $('.js-2').hide()
        $('.js-3').hide()

        $('select[name=gid]').html('<option value="">选择游戏</option>')
        form.render('select');
        var cid = $('select[name=cid]').val()
        if(!cid){
            return layer.msg('请先选择渠道！')
        }
        var apptype = data.value
        if(apptype>0){
            gameMap = tool.getGameOption({apptype:apptype})
            if(apptype == 1){
                $('.js-1').show()
            }
            if(apptype == 2){
                $('.js-2').show()
            }
            if(apptype == 3){
                $('.js-3').show()
            }
        } 
    })

    form.on('select(gid)',function(data){
        var gid = data.value;
        var cid = $('select[name=cid]').val()
        if(!cid){
            return layer.msg('请先选择渠道！')
        }
        var apptype = $('input[name=apptype]:checked').val()
        if(gid > 0){
            if(apptype == 1){
                getCanUsedPkgNumber({gid:gid,cid:cid,status:1})
            }
            if(apptype == 2){
                console.log(gameMap)
                var appleurl = '无！请在游戏管理里添加！'
                if(gameMap[gid].appid){
                    appleurl = 'https://itunes.apple.com/cn/app/id'+gameMap[gid].appid
                }
                $('#js-apple-url').html(appleurl)
                $('.js-2').show()
            }
            if(apptype == 3){
                var appid = '无！请在游戏管理里添加'
                if(gameMap[gid].appid){
                    appid = gameMap[gid].appid
                }
                $('#js-mini-appid').html(appid)
                $('.js-3').show()
            }
        }else{

        }
       
        
    })

    function getCanUsedPkgNumber(params){
        $('.js-pkg-select').show()
        $('#pkg').html('').addClass('layui-input')
        var queryString = tool.jsonToQueryString(params)
        tool.ajaxGetSync('/platform/getCanUsedPkgNumber?'+queryString,function(result){
            if(result.state){
                $('.js-pkg-number').html(result.data.number)
                if(result.data.number>0){
                    var dataArr = []
                    var list = result.data.list
                    list.forEach(element => {
                        var pkgname = element.pkg
                        if(element.specname){
                            pkgname += '('+element.specname+')'
                        }
                        dataArr.push({name:element.pkg,value:pkgname})
                    });

                    xmSelect.render({
                        el: "#pkg",
                        name: 'pkg',
                        tips: '选择渠道包',
                        style:{
                            width:'500px'
                        },
                        toolbar: {
                            show: true,
                            showIcon: false,
                            list: [  ]
                        },
                        size:'mini',
                        height: '300px',
                        model: {
                            label: {
                                type: 'name', //自定义与下面的对应
                                name: {
                                    template(data,sels){
                                        return "<span style='font-size:12px'>已选择 " + sels.length + "个渠道包，将创建"+sels.length+"条推广链</span>"
                                    }
                                },
                            }
                        },
                        data: dataArr,
                    });
                    $('.js-pkg-tips').show()
                    $('.js-pkg-select').show()
                    $('#pkg').removeClass('layui-input')
                }
            }
        })
    }

    if(Number(id)>0){
        $('.js-1').hide()
        $('.js-2').hide()
        $('.js-3').hide()
        tool.ajaxGet('/mk/getAdLinkInfo?id='+id, function(result){
            if(result.state){
                $('.js-linkid-txt').html(result.data.linkid)
                $('.js-linkid').show()
                tool.getAdAccountOption({cid:result.data.cid})
                form.val('filter-form',result.data);
                tool.getGameOption({apptype:result.data.apptype})
                form.val('filter-form',{gid:result.data.gid});

                $('select[name=cid]').attr('disabled',true)
                $('select[name=gid]').attr('disabled',true)
                $('input[name=apptype]').attr('disabled',true)
                form.render();
            }else{
                layer.msg(re.msg);
            }
        });
        form.render();
    }

    //监听提交
    form.on('submit(commit)', function(data){
        tool.ajaxPost('/mk/addAdLinkAction',form.val('filter-form'),function(re){
            // console.log(re);
            layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                shadeClose: true,
                content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                time: 2000,
                end:function(){
                    if(re.state == true){
                        closeLayer()
                        parent.window.location.reload();
                    }
                }
            });
        },'json');
        return false;
    });

    $('#closeBtn').on('click',function(){
        closeLayer()
    });

    function closeLayer(){
        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
        parent.layer.close(index); //再执行关闭
    }
});
</script>
<{include file="../public/foot.html"}>
