<{include file="../public/head.html"}>
<style>
.layui-form-label{width:200px;}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body my-card">
            <form class="layui-form my-layui-form layui-card-body" lay-filter="filter-form">
                <input type="hidden" name="pitid" value="" />
                
                <div class="layui-form-item js-admin">
                    <label class="layui-form-label">投放人员</label>
                    <div class="layui-input-inline">
                        <select id="_pitid" name="_pitid" lay-search="" lay-filter="_pitid">
                            <option value="">请选择投放人员</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">投放人员名称</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="pitname" value="" readonly>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">投放分组</label>
                    <div class="layui-input-inline">
                        <select id="teamid" name="teamid" lay-search="">
                            <option value="">请选择分组</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">排序</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="sort" value="100">
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn layui-btn-sm"  lay-submit lay-filter="commit"> 保 存 </button>
                        <button type="button" id="closeBtn" class="layui-btn layui-btn-normal layui-btn-sm"> 取 消 </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
layui.use(['tool','form'], function(){
    var $ = layui.$;
    var form = layui.form;
    var tool = layui.tool;
    var id = tool.getQueryString('id') || '';

    tool.ajaxGetSync('/mk/getPitcherTeamOption',function(result){
        if(result.state){
            var list = result.data
            var select = $('select[name=teamid]');
            for(var i in list){
                select.append('<option value="'+list[i]['teamid']+'"> ['+list[i]['teamid']+ ']-'+list[i]['teamname']+'</option>');
            }
            form.render('select');
        }
    })

    if(Number(id)>0){
        $('.js-admin').hide()
        tool.ajaxGet('/mk/getPitcherInfo?id='+id, function(result){
            if(result.state){
                form.val('filter-form',result.data);
            }else{
                layer.msg(re.msg);
            }
            form.render();
        });
    }else{
        var adminUser
        tool.ajaxGetSync('/mk/getEnabledPitcherOption',function(result){
            adminUser = {}
            if(result.state){
                var list = result.data
                var select = $('select[name=_pitid]');
                for(var i in list){
                    adminUser[list[i]['admin_id']] = list[i]['nick']
                    select.append('<option value="'+list[i]['admin_id']+'"> ['+list[i]['admin_id']+ ']-'+list[i]['nick']+'</option>');
                }
                form.render('select');
            }
        })

        form.on('select(_pitid)', function (data) {
            // console.log(data.elem);    //原生Dom
            // console.log(data.value);   //选中的option的value
            // console.log(data.othis);   //美化后Dom
            if(data.value>0){
                // console.log(adminUser[data.value])
                $('input[name=pitname]').val(adminUser[data.value])
            }
        })
    }

    //监听提交
    form.on('submit(commit)', function(data){
        tool.ajaxPost('/mk/addPitcherAction',form.val('filter-form'),function(re){
            // console.log(re);
            layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                shadeClose: true,
                content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                time: 2000,
                end:function(){
                    if(re.state == true){
                        closeLayer()
                        parent.window.location.reload();
                    }
                }
            });
        },'json');
        return false;
    });

    $('#closeBtn').on('click',function(){
        closeLayer()
    });

    function closeLayer(){
        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
        parent.layer.close(index); //再执行关闭
    }
});
</script>
