<{include file="../public/head.html"}>
<style>
.layui-layer-page .layui-layer-title{
    overflow: hidden!important;
}
.layui-form-item .layui-input-inline {
    width: 176px!important;
}
xm-select {
    min-height: 30px;width: 174px
}
xm-select > .xm-tips {
    height: 30px;font-size: 12px;
}
xm-select .xm-body-cascader {
    overflow-x: hidden;overflow-y: auto;height: 170px;
}
xm-select .xm-label .scroll .label-content {
    font-size: 12px;
    font-weight: bold;
    line-height: 26px;
}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-form layui-card-header layuiadmin-card-header-auto my-layui-form">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <div class="layui-input-inline" id="form_date"></div>
                    <div class="layui-input-inline">
                        <select id="mgid" name="mgid" lay-search="">
                            <option value="">请选择主游戏</option>
                        </select>
                    </div>
                    <div class="layui-input-inline">
                        <select name="gid" lay-search="" lay-filter="gid">
                            <option value="">选择游戏</option>
                        </select>
                    </div>
                    <div class="layui-input-inline">
                        <select name="cid" lay-search="" lay-filter="cid">
                            <option value="">选择渠道</option>
                        </select>
                    </div>
                    <div class="layui-input-inline">
                        <select name="dtype" lay-search="" lay-filter="dtype">
                            <option value="">选择设备类型</option>
                            <option value="1">安卓</option>
                            <option value="2">iOS</option>
                        </select>
                    </div>
                    <input type="checkbox" lay-skin="primary" class="has_cost" title="仅有消耗" value="1" >
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline">
                    <div class="layui-input-inline">
                        <select name="pitid" lay-search="" lay-filter="pitid">
                            <option value="">选择投放人员</option>
                        </select>
                    </div>
                    <div class="layui-input-inline" id="accid"></div>
                    <div class="layui-input-inline" id="linkid"></div>
                    <div class="layui-btn-group">
                        <button type="submit" class="layui-btn layui-btn-sm" lay-submit lay-filter="formDemo"> 筛 选 </button>
                        <button type="button" class="layui-btn layui-btn-sm" id="custom_cols"> 自定义列 </button>
                        <button type="button" class="layui-btn layui-btn-sm" id="expend">收起</button>
                    </div>
                </div>

            </div>
            <div class="layui-form-item expend">
                <label class="layui-form-label"  style="width:30px">金额</label>
                <div class="layui-input-block" style="margin-left:40px">
                    <input type="radio" name="divide" value="1" title="实收" class="check_default">
                    <input type="radio" name="divide" value="2" title="扣研发分成">
                    <input type="radio" name="divide" value="3" title="扣渠道分成">
                    <input type="radio" name="divide" value="0" title="流水">
                </div>
            </div>
            <div class="layui-form-item expend">
                <label class="layui-form-label" style="width:30px">维度</label>
                <div class="layui-input-block" style="margin-left:40px">
                    <input type="checkbox" lay-skin="primary" class="groupby check_default" title="日期" value="date" >
                    <input type="checkbox" lay-skin="primary" class="groupby check_default" title="主游戏" value="mgid" >
                    <input type="checkbox" lay-skin="primary" class="groupby" title="游戏" value="gid" >
                    <input type="checkbox" lay-skin="primary" class="groupby" title="渠道" value="cid" >
                    <input type="checkbox" lay-skin="primary" class="groupby" title="投放人员" value="pitid">
                    <input type="checkbox" lay-skin="primary" class="groupby" title="投放帐号" value="accid">
                    <input type="checkbox" lay-skin="primary" class="groupby" title="推广链" value="linkid">
                </div>
            </div>
            <div class="layui-form-item expend">
                <label class="layui-form-label" style="width:30px">指标</label>
                <div class="layui-input-block" style="margin-left:40px">
                    <input type="radio" name="index" value="roi" title="ROI" class="check_default">
                    <input type="radio" name="index" value="ltv" title="LTV">
                    <input type="radio" name="index" value="retain" title="留存">
                    <input type="radio" name="index" value="pay_retain" title="付费留存">
                    <input type="radio" name="index" value="beilv" title="ROI倍率">
                    <input type="radio" name="index" value="increase" title="ROI变化值">
                </div>
            </div>
        </div>
        
        <div class="layui-card-body layui-form  my-layui-form">
            <table class="layui-table" id="mytable2" lay-filter="filter-table" style="">
               
            </table>
        </div>
    </div>
</div>
<script>

layui.use(['form','tool','table','xmSelect'], function(){
    var $ = layui.$;
    var form = layui.form;
    var table = layui.table;
    var tool = layui.tool;
    var xmSelect = layui.xmSelect;

    var mgids = tool.getMGameOption()
    var gids = tool.getGameOption()
    var cids = tool.getChannelOption();
    var accids = tool.getAdAccountOption({},{multi:true})
    var cpnids = tool.getCompanyOption();
    var pitids = tool.getPitcherOption()

    var date8,date1;
    var timestamp8,timestamp1;
    var today = new Date()
    timestamp8 = today.getTime()-86400000*7;
    timestamp1 = today.getTime();

    date8 = tool.toDateString(timestamp8,'yyyy-MM-dd')
    date1 = tool.toDateString(timestamp1,'yyyy-MM-dd')
    tool.renderBetweenDate({elem: 'form_date',name: 'date',value:date8+' - '+date1})
    tool.renderAdLink({elem: 'linkid',pageSize: 10})
    $('.check_default').each(function(){
        $(this).prop('checked',true);
    })
    $('.has_cost').prop('checked',true)
    form.render()

    var cols,rows;
    var where = {}
    where.sdate = date8;
    where.edate = date1;
    where.has_cost = $('.has_cost:checked').val()

    var renderTableData = function(where,callback){
        var load_index = layer.load(3);
        tool.ajaxGet('/mkDayReport/getData/?'+tool.jsonToQueryString(where), function(result){
            layer.close(load_index);
            if(result.state){
                cols = result.data.cols || [];
                rows = result.data.rows || [];
                callback()
            }else{
                layer.msg(re.msg);
            }
        });
    }
    renderTableData(where,function(){
        table.render({
            elem: '#mytable2'
            ,size: 'sm'
            ,height: 'full-1'
            ,limit: 10000
            ,cols: cols
            ,data: rows
            ,myTotalRow:true
            ,done: function(res, curr, count){
                var tableHeight = $('.layui-form.layui-border-box.layui-table-view');
                var h = parseInt(tableHeight.css('height'))
                tableHeight.css('height',(h-30)+'px')
                var tableHeight2 = $('.layui-table-body,.layui-table-main');
                var h2 = parseInt(tableHeight2.css('height'))
                tableHeight2.css('height',(h2-30)+'px')
                $('.layui-table-fixed,.layui-table-fixed-l .layui-table-body').css('height',(h2-45)+'px')
                var data = res.data;
                if(data.length){
                    for(var i=0;i<data.length;i++){
                        if(i ===0){
                            $('.layui-table-body table tr[data-index='+i+']').css('backgroundColor','#eeeeee');
                        }else if(data[i].date==''){
                            $('.layui-table-body table tr[data-index='+i+']').css('backgroundColor','#eeeeee59');
                        }
                    }
                }
                //renderTableColor()
                $('body').on('click','th',function(){
                    //renderTableColor()
                })
                
            }
        });
    });

    // //监听提交
    form.on('submit(formDemo)', function(data){
        //处理日期
        var date = $('#date').val();
        var arr = date.split(' - ');
        $('input[name=sdate]').val(arr[0]);
        $('input[name=edate]').val(arr[1]);

        var where = data.field;
        where.sdate = arr[0]
        where.edate = arr[1]

        where.has_cost = $('.has_cost:checked') && $('.has_cost:checked').val() || 0

        var groupby = []
        $('.groupby').each(function(i){
            if($(this).is(':checked')){
                groupby.push($(this).val())
            }
        })
        where.groupby = groupby.join(',')

        renderTableData(where,function(){
            table.reload('mytable2', {
                cols: cols
                ,data: rows
            });
        })
    });

    $('#expend').click(function(){
        if($(this).text()=='收起'){
            $(this).text('展开')
            $('.expend').hide()
        }else{
            $(this).text('收起')
            $('.expend').show()
        }
    })

    var makeCostomContent = function(list,type){
        var content = '<div class="layui-form" class="js-form" style="padding: 10px;"><div class="layui-form-item"><input type="checkbox" lay-filter="jsall" data-type="'+type+'" lay-skin="primary" title="全选/全不选" value="0"></div><div class="layui-form-item"><div class="layui-inline">'
        for(var i=0;i<list.length;i++){
            var checked = list[i].checked === true ? 'checked':''
            content+= '<input type="checkbox" class="js-custom-cols '+type+'" lay-skin="primary" value="'+list[i].field+'" title="'+list[i].title+'" '+checked+'>';
        }
        content += '</div></div></div>';

        return content
    }

    form.on('checkbox(jsall)', function (data) {
        var type = $(this).attr('data-type')
        if(data.elem.checked){
            $('.js-custom-cols').each(function(){
                if($(this).hasClass(type)){
                    $(this).prop('checked',true)
                }
            })
        }else{
            $('.js-custom-cols').each(function(){
                if($(this).hasClass(type)){
                    $(this).prop('checked',false)
                }
            })
        }
        form.render('checkbox')
    });

    //自定义列
    $('#custom_cols').click(function(){
         $.ajax({
            url : '/mkDayReport/getCustomCols/',
            type : "GET",
            dataType : 'json',
            success : function (res){
                result = res.data
                var tab = [];
                var base = result.base
                var roi = result.roi
                var ltv = result.ltv
                var retain = result.retain
                var pay_retain = result.pay_retain

                layer.tab({
                    area: ['800px', '300px'],
                    tab: [{
                        title: '基础列', 
                        content: makeCostomContent(base,'base')
                    }, {
                        title: 'ROI', 
                        content: makeCostomContent(roi,'roi')
                    }, {
                        title: 'LTV', 
                        content: makeCostomContent(ltv,'ltv')
                    },  {
                        title: '留存', 
                        content: makeCostomContent(retain,'retain')
                    },  {
                        title: '付费留存', 
                        content: makeCostomContent(pay_retain,'pay_retain')
                    }],
                    success: function(){
                        form.render('checkbox')
                    },
                    cancel: function(){
                        var checked = [];
                        $('.js-custom-cols').each(function(){
                            if($(this).is(':checked')){
                                checked.push($(this).val())
                            }
                        })
                        
                        $.ajax({
                            url : '/mkDayReport/setCustomCols/',
                            type : "POST",
                            data: {cols:checked},
                            dataType : 'json',
                            success: function(){
                                
                            }
                        })
                    }
                });
            }
        });
    });


});

</script>
