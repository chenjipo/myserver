<{include file="../public/head.html"}>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-form layui-card-header layuiadmin-card-header-auto my-layui-form">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="title" value="" placeholder="公告标题模糊搜索">
                    </div>
                </div>
                <div class="layui-inline layui-btn-group">
                    <button type="submit" class="layui-btn layui-btn-sm" lay-submit lay-filter="filter-search"> 筛 选 </button>
                    <button type="submit" class="layui-btn layui-btn-sm layui-btn-normal js-add"> 添 加 </button>
                    <button type="submit" class="layui-btn layui-btn-sm layui-btn-normal js-sync"> 一键发布公告 </button>
                </div>
            </div>
        </div>
        <div class="layui-card-body my-card">
            <table class="layui-table" id="my-table" lay-filter="filter-table"></table>
            <script type="text/html" id="my-operate">
                <div class="layui-btn-group">
                    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a>
                    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
                </div>
            </script>
        </div>
    </div>
</div>
<script>
layui.use(['tool','table'], function(){
    var $ = layui.$;
    var form = layui.form;
    var table = layui.table;
    var tool = layui.tool;

    table.render({
        elem: '#my-table'
        ,size: 'sm'
        ,url:'/optManage/getAnnouncementList'
        ,cols: [[
            {field:'id', title: 'ID',width:50}
            ,{field:'title', title: '公告标题',width:200}
            ,{field:'close_second',  title: '几秒后关闭',width:100}
            ,{field:'start_time',  title: '开始时间',width:150}
            ,{field:'end_time',  title: '结束时间',width:150}
            ,{field:'atime',  title: '创建时间',width:150}
            ,{field:'mtime',  title: '修改时间',width:150}
            ,{title:'操作', align:'center', toolbar: '#my-operate',width:150}
        ]]
        ,page: {
            layout: ['prev', 'page', 'next', 'skip' ,'count']
            ,limit:20
        }
        ,parseData: function(res){
            var list = res.data.list;
            if(list != undefined && list.length>0){
                for(var i=0;i<list.length;i++){
                    list[i].atime =  tool.toDateString(list[i].atime);
                    list[i].start_time =  tool.toDateString(list[i].start_time);
                    list[i].end_time =  tool.toDateString(list[i].end_time);
                }
            }
            return {
                "code": 0,
                'msg': "获取数据成功！",
                "count": res.data.total,
                "data": res.data.list
            }
        }
        ,done: function(res, curr, count){

        }
    });

    //监听搜索
    form.on('submit(filter-search)', function(data){
        var field = data.field;
        //执行重载
        table.reload('my-table', {
            where: field
        });
    });

    //监听工具条
    table.on('tool(filter-table)', function(obj){
        var data = obj.data;
        if(obj.event === 'del'){
            
        } else if(obj.event === 'edit'){
            add(data);
        } 
    });

    // 添加APP按钮
    $(".js-add").click(function(){
        add();
    })

    //一键发布公告
    $(".js-sync").click(function(){
        tool.ajaxPost('/optManage/syncAnnouncementAction',{},function(re){
            // console.log(re);
            layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                shadeClose: true,
                content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                time: 2000,
                end:function(){
                    if(re.state == true){
                        closeLayer()
                        parent.window.location.reload();
                    }
                }
            });
        },'json');
    })

    function add(edit){
        var api = "/optManage/addAnnouncementPage";
        var txt = "添加";
        if(edit){
            api += "?id="+edit.id;
            txt = "编辑"
        }
        var index = layui.layer.open({
            title: txt,
            type: 2,
            area: ["1px", "1px"],
            content: api
        })
        layui.layer.full(index);
        $(window).on("resize",function(){
            layui.layer.full(index);
        })
    }
});
</script>
<{include file="../public/foot.html"}>
