<{include file="../public/head.html"}>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-form layui-card-header layuiadmin-card-header-auto my-layui-form">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <div class="layui-input-inline">
                        <select name="type" lay-search="" lay-filter="type">
                            <option value="">选择类型</option>
                            <option value="device_id">SDK设备ID</option>
                            <option value="ip">客户端IP</option>
                        </select>
                    </div>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="name" value="" placeholder="黑名单">
                    </div>
                </div>
                <div class="layui-inline layui-btn-group">
                    <button type="submit" class="layui-btn layui-btn-sm" lay-submit lay-filter="filter-search"> 筛 选 </button>
                    <button type="submit" class="layui-btn layui-btn-sm layui-btn-normal js-add"> 添 加 </button>
                </div>
            </div>
        </div>
        <div class="layui-card-body my-card">
            <table class="layui-table" id="my-table" lay-filter="filter-table"></table>
            <script type="text/html" id="my-operate">
                <div class="layui-btn-group">
                    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
                </div>
            </script>
            <script type="text/html" id="toolbar">
                <div class="layui-btn-container">
                  <button class="layui-btn layui-btn-sm" lay-event="multi-delete">批量删除</button>
                </div>
              </script>
        </div>
    </div>
</div>
<script>
layui.use(['tool','table'], function(){
    var $ = layui.$;
    var form = layui.form;
    var table = layui.table;
    var tool = layui.tool;

    table.render({
        elem: '#my-table'
        ,size: 'sm'
        ,url:'/optManage/getSdkBlackNameList'
        ,toolbar: '#toolbar' //开启头部工具栏，并为其绑定左侧模板
        ,defaultToolbar: []
        ,cols: [[
            {type:'checkbox'}
            ,{field:'name', title: '黑名单'}
            ,{field:'type', title: '类型'}
            ,{field:'atime',  title: '创建时间'}
            ,{title:'操作', align:'center', toolbar: '#my-operate'}
        ]]
        ,page: {
            layout: ['prev', 'page', 'next', 'skip' ,'count']
            ,limit:20
        }
        ,parseData: function(res){
            var list = res.data.list;
            if(list != undefined && list.length>0){
                for(var i=0;i<list.length;i++){
                    list[i].atime =  tool.toDateString(list[i].atime);
                }
            }
            return {
                "code": 0,
                'msg': "获取数据成功！",
                "count": res.data.total,
                "data": res.data.list
            }
        }
        ,done: function(res, curr, count){

        }
    });

    //头工具栏事件
    table.on('toolbar(filter-table)', function(obj){
        var checkStatus = table.checkStatus(obj.config.id);
        switch(obj.event){
            case 'multi-delete':
                var ids = []
                var data = checkStatus.data;
                for (let index = 0; index < data.length; index++) {
                    ids.push(data[index]['id']);
                }
                layer.confirm('真的删除么', function(index){
                    del(ids.join(','));
                    layer.close(index);
                });
            break;
        
        };
    });

    //监听搜索
    form.on('submit(filter-search)', function(data){
        var field = data.field;
        //执行重载
        table.reload('my-table', {
            where: field
        });
    });

    //监听工具条
    table.on('tool(filter-table)', function(obj){
        var data = obj.data;
        if(obj.event === 'del'){
            layer.confirm('真的删除么', function(index){
                del(data);
                obj.del();
                layer.close(index);
            });
        } else if(obj.event === 'edit'){
            add(data);
        } 
    });

    // 添加APP按钮
    $(".js-add").click(function(){
        add();
    })

    function add(edit){
        var api = "/optManage/addSdkBlackNamePage";
        var txt = "添加";
        if(edit){
            api += "?id="+edit.id;
            txt = "编辑"
        }
        var index = layui.layer.open({
            title: txt,
            type: 2,
            area: ["1px", "1px"],
            content: api
        })
        layui.layer.full(index);
        $(window).on("resize",function(){
            layui.layer.full(index);
        })
    }

    function del(ids){
        // console.log(data);
        tool.ajaxPost('/optManage/deleteSdkBlackNameAction',{'ids':ids},function(re){
            // console.log(re)
            layer.open({
                type: 1,
                title:false,
                closeBtn: 0,
                shadeClose: true,
                content:'<p style="margin:15px 30px;">'+re.msg+'</p>',
                time:1000,
                end:function(){
                    window.location.reload()
                }
            });
        },'json');
    }
});
</script>
<{include file="../public/foot.html"}>
