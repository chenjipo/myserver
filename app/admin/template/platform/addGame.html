<{include file="../public/head.html"}>
<style>
.layui-form-label{width:200px;}
/*icon上传按钮*/
.btn-file {position: relative; overflow: hidden;}
.btn-file input[type=file] {position: absolute; top: 0; right: 0; min-width: 100%; min-height: 100%; font-size: 100px; text-align: right; filter: alpha(opacity = 0); opacity: 0; outline: none; background: white; cursor: inherit; display: block;}
.layui-form-item .layui-input-inline {width: 600px;}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body my-card">
            <form class="layui-form my-layui-form layui-card-body" lay-filter="filter-form">
                <input type="hidden" name="gid" value="" />
                <div class="layui-form-item">
                    <label class="layui-form-label">应用类型</label>
                    <div class="layui-input-inline">
                        <input type="radio" name="apptype" lay-filter="apptype" value="1" title="Android">
                        <input type="radio" name="apptype" lay-filter="apptype" value="2" title="iOS" >
                        <input type="radio" name="apptype" lay-filter="apptype" value="3" title="小游戏" >
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">屏幕</label>
                    <div class="layui-input-inline">
                        <input type="radio" name="screen" value="1" title="竖屏">
                        <input type="radio" name="screen" value="2" title="横屏" >
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">主游戏</label>
                    <div class="layui-input-inline">
                        <select id="mgid" name="mgid" lay-search="">
                            <option value="">请选择主游戏</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">游戏名称</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="gname" value="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">游戏简称</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="slug" value="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">英文名</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="dpgn" value="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">icon</label>
                    <div class="layui-input-inline input-group" style="height: 100%;">
                        <img id="icon-src" src="" style="max-height:220px;max-width:80%;margin-bottom:8px;" class="img-thumbnail">
                        <span class="layui-btn btn-success btn-file layui-btn-sm"><i class="layui-icon"></i> 选择图片(不大于250*250png)
                            <span class="glyphicon glyphicon-floppy-open" aria-hidden="true"></span>
                            <input type="file" name="file" value="">
                        </span>
                        <input type="hidden" name="icon" value="" />
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">研发H5游戏链接</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="h5link"  value="" placeholder="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">研发发货链接</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="coinlink"  value="" placeholder="">
                    </div>
                </div>

                <div class="layui-form-item js-apptype-2" style="display: none;">
                    <label class="layui-form-label">苹果应用appid</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="appid"  value="" placeholder="">
                    </div>
                </div>

                <div class="layui-form-item js-apptype-3" style="display: none;">
                    <label class="layui-form-label">小游戏appid</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="appid"  value="" placeholder="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">排序</label>
                    <div class="layui-input-inline" style="width: 180px">
                        <input type="text" class="layui-input" name="sort"  value="100" placeholder="数字越大越靠前">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">sdkkey</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="sdkkey" placeholder="系统自动生成" value="" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">serverkey</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="serverkey" placeholder="系统自动生成" value="" disabled>
                    </div>
                </div>
                

                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline">
                        <input type="radio" name="status" value="0" title="正常运营" checked>
                        <input type="radio" name="status" value="1" title="关闭" >
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn layui-btn-sm"  lay-submit lay-filter="commit"> 保 存 </button>
                        <button type="button" id="closeBtn" class="layui-btn layui-btn-normal layui-btn-sm"> 取 消 </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
layui.use(['tool','form','tool'], function(){
    var $ = layui.$;
    var form = layui.form;
    var tool = layui.tool;
    var gid = tool.getQueryString('gid') || '';

    tool.ajaxGetSync('/platform/getMgameOption',function(result){
        if(result.state){
            var list = result.data
            var select = $('select[name=mgid]');
            for(var i in list){
                select.append('<option value="'+list[i]['mgid']+'"> ['+list[i]['mgid']+ ']-'+list[i]['mgname']+'</option>');
            }
            form.render('select');
        }
    })

    form.on('radio(apptype)',function(data){
        $('.js-apptype-2').hide();
        $('.js-apptype-3').hide();
        var apptype = data.value;
        if(apptype == 2){
            $('.js-apptype-2').show();
        }
        if(apptype == 3){
            $('.js-apptype-3').show();
        }
    })

    if(Number(gid)>0){
        tool.ajaxGet('/platform/getGameInfo?gid='+gid, function(result){
            if(result.state){
                form.val('filter-form',result.data);
                $('#icon-src').attr('src',result.data.icon)
                if(result.data.apptype == 1){
                    $('.js-apptype-1').show();
                }
                if(result.data.apptype == 2){
                    $('.js-apptype-2').show();
                }
                if(result.data.apptype == 3){
                    $('.js-apptype-3').show();
                }
            }else{
                layer.msg(re.msg);
            }
        });
        $('input[name=apptype]').attr('disabled',true)
        $('input[name=screen]').attr('disabled',true)
        $('input[name=slug]').attr('readonly',true)
        $('input[name=sdkkey]').attr('readonly',true)
        $('input[name=serverkey]').attr('readonly',true)
        $('select[name=mgid]').attr('disabled',true)

        form.render();
    }

    // 图标icon上传
    $('input[name="file"]').on('change',function(){
        var parent = $(this).parents('.input-group');
        var index = layer.load(2, {
            shade: [0.6,'#fff'] //0.1透明度的白色背景
        });
        $.ajax({
            url: '/platform/uploadGameIcon?file_name=file',  //server script to process data
            type: 'POST',
            success: function(re){
                layer.close(index);
                re = JSON.parse(re);
                console.log(re)
                if(re.state){
                    parent.find('input[name=icon]').val(re.data.url);
                    parent.find('.img-thumbnail').attr('src',re.data.url);
                }else{
                    layer.msg(re.msg);
                }
            },
            error: function(error){
                layer.msg(error);
            },
            data: new FormData($('form')[0]),
            cache: false,
            contentType: false,
            processData: false
        });
    });

    //监听提交
    form.on('submit(commit)', function(data){
        tool.ajaxPost('/platform/addGameAction',form.val('filter-form'),function(re){
            // console.log(re);
            layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                shadeClose: true,
                content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                time: 2000,
                end:function(){
                    if(re.state == true){
                        closeLayer()
                        parent.window.location.reload();
                    }
                }
            });
        },'json');
        return false;
    });

    $('#closeBtn').on('click',function(){
        closeLayer()
    });

    function closeLayer(){
        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
        parent.layer.close(index); //再执行关闭
    }
});
</script>
<{include file="../public/foot.html"}>
