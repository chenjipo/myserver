<{include file="../public/head.html"}>
<style>
.layui-form-label{width:200px;}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body my-card">
            <form class="layui-form my-layui-form layui-card-body" lay-filter="filter-form">
                <input type="hidden" name="id" value="" />
                <div class="layui-card">
                    <div class="layui-card-header"><b>基础信息</b></div>
                    <div class="layui-card-body">
                        <div class="layui-form-item">
                            <label class="layui-form-label">选择游戏</label>
                            <div class="layui-input-inline">
                                <select name="gid" lay-search="" lay-filter="gid">
                                    <option value="">选择游戏</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">选择联运商</label>
                            <div class="layui-input-inline">
                                <select name="pid" lay-search="" lay-filter="pid">
                                    <option value="">选择联运商</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-card">
                    <div class="layui-card-header"><b>参数配置</b></div>
                    <div class="layui-card-body">
                        <div id="config_tpl">
                        </div>
                    </div>
                </div>
                

                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn layui-btn-sm"  lay-submit lay-filter="commit"> 保 存 </button>
                        <button type="button" id="closeBtn" class="layui-btn layui-btn-normal layui-btn-sm"> 取 消 </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
layui.use(['tool','form'], function(){
    var $ = layui.$;
    var form = layui.form;
    var tool = layui.tool;
    var id = tool.getQueryString('id') || '';

    tool.getPartnerOption()
    tool.getGameOption({apptype:1})
    
    form.on('select(pid)',function(data){
        getTpl(data.value)
    })

    function getTpl(pid){
        tool.ajaxGetSync('/platform/getPartnerConfigTplInfo?pid='+pid,function(result){
            if(result.state && result.data){
                var html = '';
                result.data.forEach(ele => {
                    html += '<div class="layui-form-item">'
                    html += '     <label class="layui-form-label">'+ele.value+'</label>'
                    html += '     <div class="layui-input-inline">'
                    html += '         <div class="layui-input-inline">'
                    html += '             <input type="text" class="layui-input" name="'+ele.key+'" value="">'
                    html += '         </div>'
                    html += '     </div>'
                    html += ' </div>'
                });
                $('#config_tpl').html(html)
            }
        })
    }
   

    if(Number(id)>0){
        tool.ajaxGet('/platform/getGamePartnerPkgInfo?id='+id, function(result){
            if(result.state){
                getTpl(result.data.pid)
                form.val('filter-form',result.data);
            }else{
                layer.msg(re.msg);
            }
        });
        form.render();
    }

    //监听提交
    form.on('submit(commit)', function(data){
        tool.ajaxPost('/platform/addGamePartnerPkgAction',form.val('filter-form'),function(re){
            // console.log(re);
            layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                shadeClose: true,
                content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                time: 2000,
                end:function(){
                    if(re.state == true){
                        closeLayer()
                        parent.window.location.reload();
                    }
                }
            });
        },'json');
        return false;
    });

    $('#closeBtn').on('click',function(){
        closeLayer()
    });

    function closeLayer(){
        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
        parent.layer.close(index); //再执行关闭
    }
});
</script>
<{include file="../public/foot.html"}>
