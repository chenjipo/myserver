<{include file="../public/head.html"}>
<style>
.layui-form-label{width:200px;}
.my-layui-form .layui-input-block {
    margin-left: 208px;
}
.layui-form-item .layui-input-inline {width: 600px;}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body my-card">
            <form class="layui-form my-layui-form layui-card-body" lay-filter="filter-form">
                <input type="hidden" name="paid" value="" />

                <div class="layui-form-item">
                    <label class="layui-form-label">金流渠道类型</label>
                    <div class="layui-input-inline">
                        <{foreach $paytype as $k=>$v }>
                            <input type="radio" name="paytype" value="<{$k}>" title="<{$v}>">
                        <{/foreach}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">渠道分成配置</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="divide" value="0" placeholder="填整数，100代表100%，没有分成可不填。">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">金流渠道名称</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="pname" value="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">主体名称</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="company" value="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">商户ID</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="partner" value="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">应用ID</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="appid" value="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">支付key</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="paykey" value="">
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">我方公钥</label>
                    <div class="layui-input-block">
                        <input type="text" class="layui-input" name="mypubkey"  value="" placeholder="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">我方私钥</label>
                    <div class="layui-input-block">
                        <input type="text" class="layui-input" name="myprikey"  value="" placeholder="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">平台公钥</label>
                    <div class="layui-input-block">
                        <input type="text" class="layui-input" name="pubkey"  value="" placeholder="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">支付域名</label>
                    <div class="layui-input-block">
                        <input type="text" class="layui-input" name="domain"  value="" placeholder="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">通知地址</label>
                    <div class="layui-input-block">
                        <input type="text" class="layui-input" name="notify_url"  value="" placeholder="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">前端返回地址</label>
                    <div class="layui-input-block">
                        <input type="text" class="layui-input" name="return_url"  value="" placeholder="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn layui-btn-sm"  lay-submit lay-filter="commit"> 保 存 </button>
                        <button type="button" id="closeBtn" class="layui-btn layui-btn-normal layui-btn-sm"> 取 消 </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
layui.use(['tool','form'], function(){
    var $ = layui.$;
    var form = layui.form;
    var tool = layui.tool;
    var id = tool.getQueryString('id') || '';

    if(Number(id)>0){
        tool.ajaxGet('/platform/getPaywayInfo?id='+id, function(result){
            if(result.state){
                form.val('filter-form',result.data);
            }else{
                layer.msg(re.msg);
            }
        });
        $('input[name=slug]').attr('readonly',true)
        form.render();
    }

    //监听提交
    form.on('submit(commit)', function(data){
        tool.ajaxPost('/platform/addPaywayAction',form.val('filter-form'),function(re){
            // console.log(re);
            layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                shadeClose: true,
                content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                time: 2000,
                end:function(){
                    if(re.state == true){
                        closeLayer()
                        parent.window.location.reload();
                    }
                }
            });
        },'json');
        return false;
    });

    $('#closeBtn').on('click',function(){
        closeLayer()
    });

    function closeLayer(){
        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
        parent.layer.close(index); //再执行关闭
    }
});
</script>
<{include file="../public/foot.html"}>
