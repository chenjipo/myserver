<{include file="../public/head.html"}>
<style>
.layui-form-label{width:170px;}
/*icon上传按钮*/
.btn-file {position: relative; overflow: hidden;}
.btn-file input[type=file] {position: absolute; top: 0; right: 0; min-width: 100%; min-height: 100%; font-size: 100px; text-align: right; filter: alpha(opacity = 0); opacity: 0; outline: none; background: white; cursor: inherit; display: block;}
.layui-form-item .layui-input-inline {width: 300px;}
.minfotable{
    width:500px;
    margin-left:16px;
}
.minfotable_td{
    width:110px;
}
</style>
<div class="layui-fluid" style="background: white;">
    <div class="layui-row">
        <div class="layui-col-md6">
            <div class="layui-card">
                <div class="layui-card-body my-card">
                    <form class="layui-form my-layui-form layui-card-body" lay-filter="filter-form">
                        <input type="hidden" name="id" value="" />
                        <div class="layui-form-item js-channel">
                            <label class="layui-form-label">*市场投放渠道</label>
                            <div class="layui-input-inline">
                                <select id="cid" name="cid" lay-search="" lay-filter='cid'>
                                    <option value="">请选择渠道</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">*游戏</label>
                            <div class="layui-input-inline">
                                <select id="gid" name="gid" lay-search="" lay-filter='gid'>
                                    <option value="">请选择游戏</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">渠道包icon(默认母包icon)</label>
                            <div class="layui-input-inline input-group" style="height: 100%;">
                                <img id="icon-src" src="" style="max-height:220px;max-width:80%;margin-bottom:8px;" class="img-thumbnail">
                                <span class="layui-btn btn-success btn-file layui-btn-sm"><i class="layui-icon"></i> 选择图片(不大于250*250png)
                                    <span class="glyphicon glyphicon-floppy-open" aria-hidden="true"></span>
                                    <input type="file" name="file" value="">
                                </span>
                                <input type="hidden" name="specicon" value="" />
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">渠道包名称(默认母包名称)</label>
                            <div class="layui-input-inline">
                                <input type="text" class="layui-input" name="specname" value="">
                            </div>
                        </div>
                        
                        <div class="layui-form-item js-number">
                            <label class="layui-form-label">*生成数量</label>
                            <div class="layui-input-inline">
                                <input type="text" class="layui-input" name="num" value="1">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label"></label>
                            <div class="layui-input-block">
                                <button type="button" class="layui-btn layui-btn-sm"  lay-submit lay-filter="commit"> 保 存 </button>
                                <button type="button" id="closeBtn" class="layui-btn layui-btn-normal layui-btn-sm"> 取 消 </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="layui-col-md6">
            <div class="mpkg-info" style="display: none;">
                <div class="mpkg-title" style="margin-left:20px;color:#333;margin-top:20px;">母包详情：<span style="color:red" id="mpkg-error"></span></div>
                <table class="layui-table minfotable" lay-size='sm'>
                    <tr><td class="minfotable_td">名称：</td><td><span class="apk-pname"></span></td></tr>
                    <tr><td class="minfotable_td">英文名：</td><td><span class="apk-dpgn"></span></td></tr>
                    <tr><td class="minfotable_td">包版本：</td><td><span class="apk-version"></span></td></tr>
                    <tr><td class="minfotable_td">sdk版本：</td><td><span class="apk-sdk-version"></span></td></tr>
                    <tr><td class="minfotable_td">包大小：</td><td><span class="apk-size"></span></td></tr>
                    <tr><td class="minfotable_td">上传时间：</td><td><span class="apk-uploadtime"></span></td></tr>
                    <tr><td class="minfotable_td">icon：</td><td><img id="apk-icon" src="" style="width:40px;height:40px;display: none;"></td></tr>
                    <tr><td class="minfotable_td">渠道sdk参数：</td><td><span class="channel_appid"></span></td></tr>
                </table>
            </div>
        </div>

    </div>
    
</div>
<script>
layui.use(['form','tool'], function(){
    var $ = layui.$;
    var form = layui.form;
    var tool = layui.tool;
    var id = tool.getQueryString('id') || '';

    tool.getGameOption({apptype:1})
    tool.getChannelOption()

    form.on('select(gid)', function (data) {
        var gid = data.value
        var cid = $('select[name=cid]').val()
        if(gid > 0 && cid>0){
            getMpkgInfo(gid,cid)
        }else{
            $('.mpkg-info').hide()
        }
    })

    function getMpkgInfo(gid,cid){
        $('.mpkg-info').show()
        $('.apk-pname').html('')
        $('.apk-dpgn').html('')
        $('.apk-version').html('')
        $('.apk-sdk-version').html('')
        $('.apk-size').html('')
        $('.apk-uploadtime').html('')
        $('#apk-icon').attr('src','')
        $('#apk-icon').hide()
        $('.channel_appid').html('')
        $('#mpkg-error').html('')
        tool.ajaxGet('/platform/getAvailableMPkg?gid='+gid+'&cid='+cid, function(result){
            if(result.state){
                var info = result.data
                $('.apk-pname').html(info.pname)
                $('.apk-dpgn').html(info.dpgn)
                $('.apk-version').html(info.version)
                $('.apk-sdk-version').html(info.sdk_version)
                $('.apk-size').html(info.size)
                $('.apk-uploadtime').html(tool.toDateString(info.uploadtime))
                if(info.icon){
                    $('#apk-icon').attr('src',info.icon)
                    $('#apk-icon').show()
                }
                $('.channel_appid').html(info.channel_appid)
            }else{
                $('#mpkg-error').html(result.msg)
            }
        })
    }


    if(Number(id)>0){
        $('.js-number').hide()
        tool.ajaxGet('/platform/getPkgInfo?id='+id, function(result){
            if(result.state){
                form.val('filter-form',result.data);
                $('select[name=gid]').attr('disabled',true)
                $('select[name=cid]').attr('disabled',true)
                form.render();
            }else{
                layer.msg(result.msg);
            }
        });
    }

    // 图标icon上传
    $('input[name="file"]').on('change',function(){
        var parent = $(this).parents('.input-group');
        var index = layer.load(2, {
            shade: [0.6,'#fff'] //0.1透明度的白色背景
        });
        $.ajax({
            url: '/platform/uploadGameIcon?file_name=file',  //server script to process data
            type: 'POST',
            success: function(re){
                layer.close(index);
                re = JSON.parse(re);
                console.log(re)
                if(re.state){
                    parent.find('input[name=specicon]').val(re.data.url);
                    parent.find('.img-thumbnail').attr('src',re.data.url);
                }else{
                    layer.msg(re.msg);
                }
            },
            error: function(error){
                layer.msg(error);
            },
            data: new FormData($('form')[0]),
            cache: false,
            contentType: false,
            processData: false
        });
    });

    //监听提交
    form.on('submit(commit)', function(data){
        tool.ajaxPost('/platform/addPkgAction',form.val('filter-form'),function(re){
            // console.log(re);
            layer.open({
                type: 1,
                title: false,
                closeBtn: 0,
                shadeClose: true,
                content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                time: 2000,
                end:function(){
                    if(re.state == true){
                        closeLayer()
                        parent.window.location.reload();
                    }
                }
            });
        },'json');
        return false;
    });

    $('#closeBtn').on('click',function(){
        closeLayer()
    });

    function closeLayer(){
        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
        parent.layer.close(index); //再执行关闭
    }
});
</script>
<{include file="../public/foot.html"}>
