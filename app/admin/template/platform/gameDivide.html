<{include file="../public/head.html"}>
<style>
.layui-form-item .layui-input-inline {width: 160px;}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-form layui-card-header layuiadmin-card-header-auto my-layui-form">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" name="date" value="" autocomplete="off" id="date">
                    </div>

                    <div class="layui-input-inline">
                        <select name="mgid" lay-search="" lay-filter="mgid">
                            <option value="">选择主游戏</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-btn-group">
                    <button type="submit" class="layui-btn layui-btn-sm" lay-submit lay-filter="filter-search"> 筛 选 </button>
                </div>
            </div>

        </div>
        <div class="layui-card-body my-card">
            <table class="layui-table" id="my-table" lay-filter="filter-table"></table>
            <script type="text/html" id="my-operate">
                <div class="layui-btn-group">
                    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a>
                    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
                </div>
            </script>
        </div>
    </div>
</div>
<script>
    layui.use(['index','util','tool', 'table','laydate'], function(){
        var $ = layui.$;
        var form = layui.form;
        var table = layui.table;
        var tool = layui.tool;
        var laydate = layui.laydate;
        var util = layui.util


        laydate.render({ 
            elem: '#date'
            ,type: 'month'
        });

        var mgids = tool.getMGameOption()

        table.render({
            elem: '#my-table'
            ,size: 'sm'
            ,url:'/platform/getGameDivideList'
            ,cols: [[
                {field:'date', title: '月份'}
                ,{field:'mgid_txt',  title: '主游戏'}
                ,{field:'divide',  title: '研发分成，按100分',edit:'text'}
            ]]
            ,parseData: function(res){
                var list = res.data.list;
                if(list != undefined && list.length>0){
                    for(var i=0;i<list.length;i++){
                        list[i].mgid_txt = mgids[list[i].mgid].mgname
                        if(list[i].divide == ''){
                            list[i].mgid_txt = '<span style="color:red">'+mgids[list[i].mgid].mgname+'</span>'
                        }
                    }
                }
                $('#date').val(util.escape(res.data.date))
                return {
                    "code": 0,
                    'msg': "获取数据成功！",
                    "count": list.length,
                    "data": list
                }
            }
            ,done: function(res, curr, count){

            }
        });

        //监听搜索
        form.on('submit(filter-search)', function(data){
            var field = data.field;
            //执行重载
            table.reload('my-table', {
                where: field
            });
        });

       //监听单元格编辑
        table.on('edit(filter-table)', function(obj){
            var value = obj.value //得到修改后的值
            ,data = obj.data //得到所在行所有键值
            ,field = obj.field; //得到字段

            tool.ajaxPost('/platform/updateGameDivideAction',data,function(re){
                // console.log(re);
                layer.open({
                    type: 1,
                    title: false,
                    closeBtn: 0,
                    shadeClose: true,
                    content: '<p style="margin:15px 30px;">'+re.msg+'</p>',
                    time: 2000,
                    end:function(){
                        // if(re.state == true){
                        //     window.location.reload();
                        // }
                    }
                });
            },'json');
        });
    });
</script>
<{include file="../public/foot.html"}>
