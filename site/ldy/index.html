<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
  <!-- Open Graph 标签 -->
  <meta property="og:title" content="SlingTv Box">
  <meta property="og:description" content="Please click on the link to help me unlock exciting programs from SlingTv Box">
  <meta property="og:image" content="./img/car.jpg">
  <meta property="og:url" content="http://sdk.linkstv.xyz/sdk/rgo">
  <meta property="og:type" content="article">

  <!-- Twitter Card 标签 -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SlingTv Box">
  <meta name="twitter:description" content="Please click on the link to help me unlock exciting programs from SlingTv Box">
  <meta name="twitter:image" content="./img/car.jpg">
  <meta name="twitter:url" content="http://sdk.linkstv.xyz/sdk/rgo">
  <meta name="twitter:site" content="@your_twitter_username">
  <link rel="icon" href="favicon.ico">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    html {
      width: 100%;
      height: 100%;
      background: #000000;
    }
    body {
      width: 100%;
    }
    .content-box {
      position: relative;
      width: 100%;
    }
    .btn-box {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
  <script>
    function goShare() {
      console.log('【去分享】', navigator);
      let url = 'http://sdk.linkstv.xyz/sdk/rgo' + window.location.search
      if (navigator.share) {
        //当浏览器支持此功能
        navigator.share({
          //要共享的标题
          title: 'SLING TV BOX',
          //要共享的 URL
          url: url,
          //要共享的文本
          text: 'Share and Unlock Exclusive RewardsSimple, Easy, and Free...',
        })
      } else {
        //当浏览器不支持此功能时
        alert("The current browser does not support this feature！");
      }
    }
  </script>
</head>

<body>
  <section class="content-box">
    <img src="./img/01.jpg" alt="" style="width: 100%;">
    <aside class="btn-box">
      <img src="./img/share-btn.png" alt="" onclick="goShare()" style="width: 160px;">
      <span id="countspan" style="color: #ffffff; font-size: 15px; font-weight: bold;"></span>
    </aside>
  </section>
  <script>
    function UrlSearch() {
      let obj = {}
      let name, value;
      let str = window.location.href; // 取得整个地址栏
      let num = str.indexOf("?") 
      str = str.substr(num+1); // 取得所有参数   stringvar.substr(start [, length ]

      var arr = str.split("&"); // 各个参数放到数组里
      for(var i = 0; i < arr.length; i++){ 
      num = arr[i].indexOf("="); 
      if(num > 0){ 
        name = arr[i].substring(0, num);
        value = arr[i].substr(num + 1);
        obj[name] = value;
        } 
      }
      return obj
    }
    console.log('【地址栏参数】', UrlSearch());
    var urlObj = UrlSearch()
    var sharemum = 0, limit_num = 0
    if (urlObj && urlObj.sharemum) {
      sharemum = urlObj.sharemum
      limit_num = urlObj.limit_num
    }
    var countText = '(share count ' + sharemum + '/' + limit_num +' )'
    console.log("【document.getElementById('#countspan')】", document.getElementById('countspan'));
    
    document.getElementById('countspan').innerText = countText
  </script>
</body>

</html>
