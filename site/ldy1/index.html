<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
  <!-- Open Graph 标签 -->
  <meta property="og:title" content="SlingTv Box">
  <meta property="og:description"
    content="Please click on the link to help me unlock exciting programs from SlingTv Box">
  <meta property="og:image" content="https://example.com/path/to/image.jpg">
  <meta property="og:url" content="https://sdk.linkstv.xyz/sdk/rgo">
  <meta property="og:type" content="article">

  <!-- Twitter Card 标签 -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SlingTv Box">
  <meta name="twitter:description"
    content="Please click on the link to help me unlock exciting programs from SlingTv Box">
  <meta name="twitter:image" content="https://example.com/path/to/image.jpg">
  <meta name="twitter:url" content="https://sdk.linkstv.xyz/sdk/rgo">
  <meta name="twitter:site" content="@your_twitter_username">
  <link rel="icon" href="favicon.ico">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      height: 100%;
      background: #000000;
    }

    body {
      width: 100%;
    }

    .content-box {
      position: relative;
      width: 100%;
    }

    .btn-box {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mask-box {
      position: fixed;
      z-index: 99;
      background: rgb(0 0 0 / 60%);
      display: none;
      justify-content: center;
      align-items: center;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
    }

    .mask-content {
      background: rgb(76, 76, 76);
      border: 4px solid rgb(56, 56, 56);
      border-radius: 12px;
      padding: 48px 12px 36px;
      position: relative;
    }

    .close-icon {
      position: absolute;
      top: 6px;
      right: 2px;
      width: 32px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/clipboard@2.0.8/dist/clipboard.min.js"></script>

  <script>
    function selectShare() {
      let maskElement = document.getElementById('maskBox')
      maskElement.style.display = 'flex'
    }
    function closeMask() {
      let maskElement = document.getElementById('maskBox')
      maskElement.style.display = 'none'
    }
    function shareJum(way, url) {
      switch (way) {
        case 1:
          window.location.href = 'https://www.facebook.com/login/device-based/regular/login'
          break;
        case 2:
          window.location.href = 'https://www.instagram.com/accounts/login/#'
          break;
        case 3:
          window.location.href = 'https://web.telegram.org/a/'
          break;
        case 4:
          window.location.href = 'https://www.tiktok.com/login'
          break;
        case 5:
          window.location.href = 'https://wa.me/?text=Please click on the link to help me unlock exciting programs from SlingTv Box page:' + url
          break;

        default:
          break;
      }
    }
    function goShare(way) {
      let url = 'https://sdk.linkstv.xyz/sdk/rgo' + window.location.search
      document.getElementById('copy-text').innerText = url
      var clipboard = new ClipboardJS('#copy-button' + way);
 
      clipboard.on('success', function(e) {
        e.clearSelection(); // 清除文本选择
        alert('Share link copied successfully!')
        shareJum(way, url)
      });
 
      clipboard.on('error', function(e) {
        console.error(e);
        shareJum(way, url)
      });

      // let url = 'http://sdk.linkstv.xyz/sdk/rgo' + window.location.search
      // if (navigator.share) {
      //   navigator.share({
      //     title: 'SLING TV BOX',
      //     url: url,
      //     text: 'Share and Unlock Exclusive RewardsSimple, Easy, and Free...',
      //   })
      // } else {
      //   alert("The current browser does not support this feature！");
      // }
    }
    
  </script>
</head>

<body>
  <section class="content-box">
    <img src="./img/01.jpg" alt="" style="width: 100%;">
    <aside class="btn-box">
      <img src="./img/share-btn.png" alt="" onclick="selectShare()" style="width: 160px;">
      <span id="countspan" style="color: #ffffff; font-size: 15px; font-weight: bold;"></span>
    </aside>
  </section>
  <section class="mask-box" id="maskBox">
    <section class="mask-content">
      <img src="./img/facebook.png" id="copy-button1" data-clipboard-target="#copy-text" alt="" onclick="goShare(1)" style="width: 54px; margin: 0px 4px;">
      <div id="copy-text" style="width: 0; height: 0; position: absolute; z-index: -99;"></div>
      <img src="./img/instagram.png" id="copy-button2" data-clipboard-target="#copy-text" alt="" onclick="goShare(2)" style="width: 54px; margin: 0px 4px;">
      <img src="./img/telegram.png" id="copy-button3" data-clipboard-target="#copy-text" alt="" onclick="goShare(3)" style="width: 54px; margin: 0px 4px;">
      <img src="./img/dou.png" id="copy-button4" data-clipboard-target="#copy-text" alt="" onclick="goShare(4)" style="width: 54px; margin: 0px 4px;">
      <a id="WhatApp" target="_blank">
        <img src="./img/wa.png" alt="" style="width: 54px; margin: 0px 4px;">
      </a >
      <img class="close-icon" src="./img/close.png" alt="" onclick="closeMask()">
    </section>
  </section>
  <script>
    let dfLink = 'https://sdk.linkstv.xyz/sdk/rgo' + encodeURIComponent(window.location.search)
    let waUrl = 'https://wa.me/?text=Please click on the link to help me unlock exciting programs from SlingTv Box page:' + dfLink
    document.getElementById('WhatApp').href = waUrl;
    function UrlSearch() {
      let obj = {}
      let name, value;
      let str = window.location.href;
      let num = str.indexOf("?")
      str = str.substr(num + 1); 

      var arr = str.split("&"); 
      for (var i = 0; i < arr.length; i++) {
        num = arr[i].indexOf("=");
        if (num > 0) {
          name = arr[i].substring(0, num);
          value = arr[i].substr(num + 1);
          obj[name] = value;
        }
      }
      return obj
    }
    var urlObj = UrlSearch()
    var sharemum = 0, limit_num = 0
    if (urlObj && urlObj.sharemum) {
      sharemum = urlObj.sharemum
      limit_num = urlObj.limit_num
    }
    var countText = '(share count ' + sharemum + '/' + limit_num + ' )'
    console.log("【document.getElementById('#countspan')】", document.getElementById('countspan'));

    document.getElementById('countspan').innerText = countText
  </script>
</body>

</html>
